<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Epidemic Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      animation: bgAnim 10s ease infinite;
    }

    @keyframes bgAnim {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: fadeIn 1s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border 0.3s;
    }

    .login-container input:focus {
      border-color: #43cea2;
      outline: none;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #43cea2, #185a9d);
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-container button:hover {
      background: linear-gradient(to right, #2bc0e4, #eaecc6);
      color: #333;
      transform: scale(1.05);
    }

    #pdfBtn {
      margin-top: 20px;
      background: linear-gradient(to right, #ff9966, #ff5e62);
    }

    #animateBtn {
      margin-top: 10px;
      background: linear-gradient(to right, #00c6ff, #0072ff);
    }

    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #2ecc71;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 9999;
    }

    #greeting {
      font-size: 1rem;
      margin-top: 10px;
      color: #333;
      font-style: italic;
    }

    #mapCanvas {
      margin-top: 30px;
      border: 2px solid #444;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 Login to Epidemic Simulator</h1>
    <form id="loginForm">
      <input type="text" id="username" name="username" placeholder="Enter your name" required>
      <button type="submit">🚀 Enter Dashboard</button>
    </form>

    <button id="pdfBtn" onclick="handlePDFExport()">📄 Export PDF</button>
    <button id="animateBtn" onclick="startMapPlayback()">▶️ Animate Spread</button>

    <div id="greeting"></div>
  </div>

  <div id="toast">✅ PDF exported successfully!</div>

  <canvas id="mapCanvas" width="500" height="500"></canvas>

  <script>
    const greeting = document.getElementById("greeting");
    const savedName = sessionStorage.getItem("user");
    if (savedName) greeting.textContent = `👋 Hello, ${savedName}!`;

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      if (username.trim()) {
        sessionStorage.setItem("user", username);
        window.location.href = "/";
      }
    });

    function handlePDFExport() {
      downloadPDF();
      const toast = document.getElementById("toast");
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3000);
    }
  </script>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
